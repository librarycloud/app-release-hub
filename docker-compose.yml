version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      DB_PATH: /data/hub.db
      FILES_DIR: /data/files
      DOWNLOAD_BASE_URL: ${DOWNLOAD_BASE_URL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      AUTO_SYNC_INTERVAL_MINUTES: ${AUTO_SYNC_INTERVAL_MINUTES:-60}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PUBLIC_DOMAIN: ${S3_PUBLIC_DOMAIN:-}
      ENABLE_NGINX_ACCEL: ${ENABLE_NGINX_ACCEL:-false}
      NGINX_INTERNAL_PATH_PREFIX: ${NGINX_INTERNAL_PATH_PREFIX:-/internal-files}
      MAX_CONCURRENT_BSDIFF: ${MAX_CONCURRENT_BSDIFF:-2}
      RATE_LIMIT_PUBLIC: ${RATE_LIMIT_PUBLIC:-60}
      RATE_LIMIT_DOWNLOADS: ${RATE_LIMIT_DOWNLOADS:-30}
    volumes:
      - hub_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web-admin:
    build:
      context: ./web-admin
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  hub_data:
