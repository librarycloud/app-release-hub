version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      DB_PATH: /data/hub.db
      FILES_DIR: /data/files
      DOWNLOAD_BASE_URL: ${DOWNLOAD_BASE_URL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - hub_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web-admin:
    build:
      context: ./web-admin
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  hub_data:
